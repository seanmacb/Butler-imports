description: cp_pipe FLAT calibration construction for DECam
instrument: lsst.obs.decam.DarkEnergyCamera
tasks:
  cpFlatIsr:
    class: lsst.ip.isr.IsrTask
    config:
    - connections.ccdExposure: raw
      connections.outputExposure: cpFlatIsrExp
      doWrite: true
      doDefect: false
      doBrighterFatter: false
      doFlat: false
      doFringe: false
      doApplyGains: false
      doSaturation: false
      maskNegativeVariance: false
      doBias: true
      doDark: true
      doInterpolate: false
      doSetBadRegions: false
    - connections.crosstalkSources: overscanRaw
      connections.bias: bias
      doDark: false
  cpFlatMeasure:
    class: lsst.cp.pipe.CpFlatMeasureTask
    config:
    - connections.inputExp: cpFlatIsrExp
      connections.outputStats: cpFlatStatistics
      doVignette: false
  cpFlatNormalize:
    class: lsst.cp.pipe.CpFlatNormalizationTask
    config:
    - connections.inputMDs: cpFlatStatistics
      connections.outputScales: cpFlatNormalizeScales
      level: AMP
  cpFlatCombine:
    class: lsst.cp.pipe.CalibCombineByFilterTask
    config:
    - connections.inputExpHandles: cpFlatIsrExp
      connections.inputScales: cpFlatNormalizeScales
      connections.outputData: flat
      calibrationType: flat
      exposureScaling: InputList
      scalingLevel: AMP
  cpFlatBin8:
    class: lsst.pipe.tasks.visualizeVisit.VisualizeBinCalibFilterTask
    config:
    - connections.inputExp: flat
      connections.outputExp: flatBin8
      binning: 8
  cpFlatBin64:
    class: lsst.pipe.tasks.visualizeVisit.VisualizeBinCalibFilterTask
    config:
    - connections.inputExp: flat
      connections.outputExp: flatBin64
      binning: 64
  cpFlatMosaic8:
    class: lsst.pipe.tasks.visualizeVisit.VisualizeMosaicCalibFilterTask
    config:
    - connections.inputExps: flatBin8
      connections.outputData: flatMosaic8
      binning: 8
  cpFlatMosaic64:
    class: lsst.pipe.tasks.visualizeVisit.VisualizeMosaicCalibFilterTask
    config:
    - connections.inputExps: flatBin64
      connections.outputData: flatMosaic64
      binning: 64
contracts:
- contract: cpFlatBin64.binning == cpFlatMosaic64.binning
- contract: cpFlatBin64.connections.inputExp == cpFlatCombine.calibrationType
- contract: cpFlatBin8.binning == cpFlatMosaic8.binning
- contract: cpFlatBin8.connections.inputExp == cpFlatCombine.calibrationType
- contract: cpFlatCombine.connections.inputExpHandles == cpFlatIsr.connections.outputExposure
- contract: cpFlatCombine.connections.inputScales == cpFlatNormalize.connections.outputScales
- contract: cpFlatIsr.doFlat == False
- contract: cpFlatMeasure.connections.inputExp == cpFlatIsr.connections.outputExposure
- contract: cpFlatMosaic64.connections.inputExps == cpFlatBin64.connections.outputExp
- contract: cpFlatMosaic8.connections.inputExps == cpFlatBin8.connections.outputExp
- contract: cpFlatNormalize.connections.inputMDs == cpFlatMeasure.connections.outputStats

